    <text x="236.2" y="320.6" class="item-sub" fill="#9D174D" text-anchor="middle">stacja ścienna</text>
    <line x1="203.8" y1="329.6" x2="203.8" y2="616.6" stroke="#16A34A" stroke-width="4" stroke-linecap="round"/>
    <text x="254.2" y="349.6" class="item-sub" fill="#15803D" font-weight="700">Kij do mopa</text>
    
    <rect x="185" y="616.6" width="108.0" height="82.8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5" rx="3"/>
    <text x="236.2" y="667.0" class="item-sub" fill="#15803D" font-weight="700" text-anchor="middle">WIADRO MOPA</text>
    
    <rect x="326.20000000000005" y="280.6" width="111.60000000000001" height="144.0" class="paper-towel-area"/>
    <text x="382.0" y="299.6" class="item-sub" fill="#047857" font-weight="700" text-anchor="middle">Ręczniki</text>
    <text x="382.0" y="312.6" class="item-sub" fill="#047857" font-weight="700" text-anchor="middle">papierowe</text>
    
    <rect x="326.20000000000005" y="447.40000000000003" width="111.60000000000001" height="129.6" fill="#F8FAFC" rx="3"/>
    <text x="382.0" y="519.4000000000001" class="item-sub" text-anchor="middle">Papier toalet.</text>
    
    <rect x="326.20000000000005" y="584.2" width="111.60000000000001" height="136.8" fill="#F8FAFC" rx="3"/>
    <text x="382.0" y="656.2" class="item-sub" text-anchor="middle">Zapasy chemii</text>
    
    <line x1="175" y1="735.4000000000001" x2="445.0" y2="735.4000000000001" class="shelf" />
    
    <rect x="181" y="749.8" width="258.0" height="64.8" class="drawer"/>
    <text x="310.0" y="793.0" class="item-text" text-anchor="middle">SZUFLADA 1: Ściereczki, zapasowe mopy, worki, rękawice gumowe</text>
    
    <rect x="181" y="821.8000000000001" width="258.0" height="64.8" class="drawer"/>
    <text x="310.0" y="865.0" class="item-text" text-anchor="middle">SZUFLADA 2: Akcesoria czyszczące, filtry, parownica</text>
    
    <rect x="451.0" y="151" width="258.0" height="119.6" fill="#F8FAFC" rx="4"/>
    <text x="580.0" y="214.8" class="item-text" text-anchor="middle">PAWLACZ: RZECZY SEZONOWE (36 cm)</text>
    <line x1="445.0" y1="274.6" x2="715.0" y2="274.6" class="shelf" />
    
    <rect x="451.0" y="280.6" width="258.0" height="115.2" class="backpack-area"/>
    <text x="580.0" y="346.6" class="item-text" fill="#1D4ED8" text-anchor="middle">PÓŁKA NA PLECAKI MIEJSKIE I SZKOLNE</text>
    <line x1="445.0" y1="397.0" x2="715.0" y2="397.0" class="shelf" />
    
    <rect x="451.0" y="411.40000000000003" width="258.0" height="115.2" class="backpack-area"/>
    <text x="580.0" y="476.20000000000005" class="item-text" fill="#1D4ED8" text-anchor="middle">PÓŁKA NA PLECAKI TURYSTYCZNE I SPORTOWE</text>
    <line x1="445.0" y1="533.8" x2="715.0" y2="533.8" class="shelf" />
    
    <rect x="451.0" y="548.2" width="258.0" height="64.8" class="drawer"/>
    <text x="580.0" y="591.4000000000001" class="item-text" text-anchor="middle">SZUFLADA 3: Czapki zimowe, kapelusze, chusty</text>
    <rect x="451.0" y="620.2" width="258.0" height="64.8" class="drawer"/>
    <text x="580.0" y="663.4000000000001" class="item-text" text-anchor="middle">SZUFLADA 4: Rękawiczki, kominy, szaliki</text>
    <rect x="451.0" y="692.2" width="258.0" height="64.8" class="drawer"/>
    <text x="580.0" y="735.4000000000001" class="item-text" text-anchor="middle">SZUFLADA 5: Okulary, etui, klucze, latarki</text>
    <rect x="451.0" y="764.2" width="258.0" height="64.8" class="drawer"/>
    <text x="580.0" y="807.4000000000001" class="item-text" text-anchor="middle">SZUFLADA 6: Drobne AGD, kable, baterie, ładowarki</text>
    
    <text x="580.0" y="974.6" class="item-sub" text-anchor="middle">Dno prawe: zapasowe pudełka / organizery</text>
    
    
    <g>
        <line x1="175" y1="145" x2="175" y2="96" stroke="#DC2626" stroke-width="1" stroke-dasharray="2,2"/>
        <line x1="715.0" y1="145" x2="715.0" y2="96" stroke="#DC2626" stroke-width="1" stroke-dasharray="2,2"/>
        <line x1="179" y1="100" x2="711.0" y2="100" stroke="#DC2626" stroke-width="1.5" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
        <text x="445.0" y="95" class="dim-text" text-anchor="middle">ŁĄCZNA SZEROKOŚĆ ŚCIANY: 150 cm</text>

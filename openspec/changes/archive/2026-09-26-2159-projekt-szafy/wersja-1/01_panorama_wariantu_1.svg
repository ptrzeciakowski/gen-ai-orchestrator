<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1618 836" width="1618" height="836" style="background:#FFFFFF;">
    
    <style>
        text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .title { font-size: 24px; font-weight: 800; fill: #0F172A; letter-spacing: -0.5px; }
        .subtitle { font-size: 13.5px; font-weight: 500; fill: #475569; }
        .corp-frame { fill: #FFFFFF; stroke: #0F172A; stroke-width: 3.5; }
        .corp-inner { fill: #F8FAFC; stroke: #94A3B8; stroke-width: 1.5; }
        .shelf { fill: #FFFFFF; stroke: #334155; stroke-width: 2.5; }
        .dryer-bg { fill: #E0F2FE; stroke: #0284C7; stroke-width: 2; rx: 6px; }
        .laundry-niche { fill: #F0FDF4; stroke: #16A34A; stroke-width: 1.5; stroke-dasharray: 4,4; rx: 4px; }
        .drawer { fill: #F1F5F9; stroke: #475569; stroke-width: 2; rx: 4px; }
        .basket { fill: #F8FAFC; stroke: #64748B; stroke-width: 1.5; stroke-dasharray: 4,3; rx: 3px; }
        .shoe-shelf-bg { fill: #F1F5F9; stroke: #64748B; stroke-width: 1.5; rx: 4px; }
        .hanging-area { fill: #FAF5FF; stroke: #A855F7; stroke-width: 1.5; stroke-dasharray: 4,4; rx: 5px; }
        .rod { stroke: #475569; stroke-width: 4; stroke-linecap: round; }
        .item-text { font-size: 11px; font-weight: 700; fill: #1E293B; }
        .item-sub { font-size: 9.5px; font-weight: 500; fill: #64748B; }
        .dim-text { font-size: 11px; font-weight: 700; fill: #DC2626; }
        .dim-title { font-size: 12.5px; font-weight: 800; fill: #DC2626; }
        .tag { font-size: 10px; font-weight: 700; fill: #FFFFFF; rx: 3px; }
    </style>
    <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
        </marker>
        <marker id="arr-rev" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
        </marker>
    </defs>

    
    <text x="90" y="45" class="title">PANORAMA UKŁADU SZAF W CAŁYM MIESZKANIU – WARIANT 1</text>
    <text x="90" y="70" class="subtitle">Wszystkie szafy narysowane w JEDNEJ wspólnej skali geometrycznej (1 cm = 2.4 px) | Widok od lewej do prawej</text>
    
    <!-- 1. PAX 58 CM (PO LEWEJ) -->
    <rect x="90" y="140" width="648.0" height="566.4" class="corp-frame" />
    <rect x="90" y="112" width="648.0" height="24" fill="#0F172A" rx="4"/>
    <text x="414.0" y="128" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">1. ISTNIEJĄCY PAX 58 cm (szer. 270 cm, gł. 58 cm) – PRALNIA &amp; GARDEROBA</text>
    
    <!-- Moduł 1: 100 cm (Pralnia z suszarką) -->
    <line x1="330.0" y1="140" x2="330.0" y2="706.4" stroke="#0F172A" stroke-width="2"/>
    <!-- Suszarka -->
    <rect x="96" y="502.4" width="144.0" height="198.0" class="dryer-bg"/>
    <circle cx="168.0" cy="605.6" r="45" fill="#BAE6FD" stroke="#0284C7" stroke-width="2"/>
    <text x="168.0" y="610.4" class="item-text" fill="#0369A1" text-anchor="middle">SUSZARKA</text>
    <text x="168.0" y="644.0" class="item-sub" fill="#0284C7" text-anchor="middle">BEKO 60cm</text>
    
    <!-- Wnęka 31 cm -->
    <rect x="244.0" y="502.4" width="68.39999999999999" height="198.0" class="laundry-niche"/>
    <text x="276.0" y="610.4" class="item-sub" fill="#15803D" font-weight="700" text-anchor="middle">KOSZ /</text>
    <text x="276.0" y="644.0" class="item-sub" fill="#15803D" font-weight="700" text-anchor="middle">CHEMIA</text>
    
    <!-- Półki nad suszarką -->
    <line x1="90" y1="226.39999999999998" x2="330.0" y2="226.39999999999998" class="shelf"/>
    <line x1="90" y1="303.2" x2="330.0" y2="303.2" class="shelf"/>
    <line x1="90" y1="375.2" x2="330.0" y2="375.2" class="shelf"/>
    <line x1="90" y1="447.2" x2="330.0" y2="447.2" class="shelf"/>
    <text x="210.0" y="192.8" class="item-sub" text-anchor="middle">Walizka czarna</text>
    <text x="210.0" y="269.6" class="item-sub" text-anchor="middle">Półka 100cm: pościele / koce</text>
    <text x="210.0" y="341.6" class="item-sub" text-anchor="middle">Półka 100cm: ręczniki</text>
    <text x="210.0" y="413.59999999999997" class="item-sub" text-anchor="middle">Półka 100cm: zapasy chemii</text>
    
    <!-- Moduł 2: 100 cm (Środek - Garderoba) -->
    <line x1="570.0" y1="140" x2="570.0" y2="706.4" stroke="#0F172A" stroke-width="2"/>
    <line x1="330.0" y1="226.39999999999998" x2="570.0" y2="226.39999999999998" class="shelf"/>
    <text x="450.0" y="192.8" class="item-sub" text-anchor="middle">Walizka czerwona</text>
    <!-- Drążek 100 cm -->
    <rect x="339.6" y="236.0" width="220.79999999999998" height="276.0" class="hanging-area"/>
    <line x1="354.0" y1="272.0" x2="546.0" y2="272.0" class="rod"/>
    <text x="450.0" y="380.0" class="item-text" fill="#7E22CE" text-anchor="middle">DRĄŻEK 100 cm (Koszule / Garnitury)</text>
    <!-- 3 szuflady + kosz -->
    <rect x="339.6" y="524.0" width="220.79999999999998" height="38.4" class="drawer"/>
    <text x="450.0" y="552.8" class="item-sub" text-anchor="middle">Szuflada KOMPLEMENT 1</text>
    <rect x="339.6" y="567.2" width="220.79999999999998" height="38.4" class="drawer"/>
    <text x="450.0" y="596.0" class="item-sub" text-anchor="middle">Szuflada KOMPLEMENT 2</text>
    <rect x="339.6" y="610.4" width="220.79999999999998" height="38.4" class="drawer"/>
    <text x="450.0" y="639.2" class="item-sub" text-anchor="middle">Szuflada KOMPLEMENT 3</text>
    <rect x="339.6" y="653.6" width="220.79999999999998" height="38.4" class="basket"/>
    <text x="450.0" y="682.4" class="item-sub" text-anchor="middle">Kosz druciany KOMPLEMENT</text>
    
    <!-- Moduł 3: 50 cm (AGD) -->
    <line x1="690.0" y1="140" x2="690.0" y2="706.4" stroke="#0F172A" stroke-width="2"/>
    <text x="630.0" y="192.8" class="item-sub" text-anchor="middle">Pawlacz</text>
    <line x1="570.0" y1="226.39999999999998" x2="690.0" y2="226.39999999999998" class="shelf"/>
    <rect x="579.5999999999999" y="236.0" width="100.8" height="312.0" fill="#F1F5F9" stroke="#94A3B8" stroke-dasharray="2,2"/>
    <text x="630.0" y="344.0" class="item-sub" font-weight="700" text-anchor="middle">ODKURZACZ</text>
    <text x="630.0" y="380.0" class="item-sub" font-weight="700" text-anchor="middle">DRABINA</text>
    <text x="630.0" y="416.0" class="item-sub" font-weight="700" text-anchor="middle">PARKSIDE</text>
    <rect x="579.5999999999999" y="560.0" width="100.8" height="43.199999999999996" class="basket"/>
    <rect x="579.5999999999999" y="610.4" width="100.8" height="84.0" fill="#E2E8F0"/>
    
    <!-- Moduł 4: 20 cm (Deska) -->
    <text x="714.0" y="192.8" class="item-sub" font-size="8" text-anchor="middle">Żelazko</text>
    <line x1="690.0" y1="226.39999999999998" x2="738.0" y2="226.39999999999998" class="shelf"/>
    <text x="714.0" y="423.2" class="item-sub" font-size="9" font-weight="700" text-anchor="middle" transform="rotate(-90 714.0 423.2)">DESKA DO PRASOWANIA</text>
    
    <!-- 2. NOWY PAX 35 CM (W ŚRODKU) -->
    <rect x="803.0" y="140" width="360.0" height="566.4" class="corp-frame" />
    <rect x="803.0" y="112" width="360.0" height="24" fill="#0284C7" rx="4"/>
    <text x="983.0" y="128" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">2. NOWY PAX 35 cm (szer. 150 cm, gł. 35/44 cm)</text>
    
    <line x1="983.0" y1="140" x2="983.0" y2="706.4" stroke="#0F172A" stroke-width="2"/>
    <!-- Lewy 75 cm: Buty -->
    <line x1="803.0" y1="226.39999999999998" x2="983.0" y2="226.39999999999998" class="shelf"/>
    <text x="893.0" y="192.8" class="item-sub" text-anchor="middle">Pudła SKUBB</text>
    
    <!-- 6 angled shoe lines -->
    
        <line x1="811.0" y1="234.39999999999998" x2="975.0" y2="299.06666666666666" stroke="#0284C7" stroke-width="2"/>
        <text x="893.0" y="266.7333333333333" class="item-sub" font-size="8.5" text-anchor="middle">Półka skośna 1 (r. 44-45)</text>
        
        <line x1="811.0" y1="311.06666666666666" x2="975.0" y2="375.73333333333335" stroke="#0284C7" stroke-width="2"/>
        <text x="893.0" y="343.4" class="item-sub" font-size="8.5" text-anchor="middle">Półka skośna 2 (r. 44-45)</text>
        
        <line x1="811.0" y1="387.73333333333335" x2="975.0" y2="452.40000000000003" stroke="#0284C7" stroke-width="2"/>
        <text x="893.0" y="420.06666666666666" class="item-sub" font-size="8.5" text-anchor="middle">Półka skośna 3 (r. 44-45)</text>
        
        <line x1="811.0" y1="464.4" x2="975.0" y2="529.0666666666666" stroke="#0284C7" stroke-width="2"/>
        <text x="893.0" y="496.7333333333333" class="item-sub" font-size="8.5" text-anchor="middle">Półka skośna 4 (r. 44-45)</text>
        
        <line x1="811.0" y1="541.0666666666666" x2="975.0" y2="605.7333333333332" stroke="#0284C7" stroke-width="2"/>
        <text x="893.0" y="573.4" class="item-sub" font-size="8.5" text-anchor="middle">Półka skośna 5 (r. 44-45)</text>
        
        <line x1="811.0" y1="617.7333333333333" x2="975.0" y2="682.4" stroke="#0284C7" stroke-width="2"/>
        <text x="893.0" y="650.0666666666667" class="item-sub" font-size="8.5" text-anchor="middle">Półka skośna 6 (r. 44-45)</text>
        
    <!-- Prawy 75 cm: Wieszak wysuwany + szuflady + buty -->
    <line x1="983.0" y1="226.39999999999998" x2="1163.0" y2="226.39999999999998" class="shelf"/>
    <text x="1073.0" y="192.8" class="item-sub" text-anchor="middle">Pudła SKUBB</text>
    
    <rect x="990.2" y="236.0" width="168.0" height="204.0" class="hanging-area"/>
    <text x="1073.0" y="344.0" class="item-text" font-size="10" fill="#7E22CE" text-anchor="middle">WIESZAK WYSUWANY</text>
    <text x="1073.0" y="375.2" class="item-sub" text-anchor="middle">5-6 kurtek lekkich</text>
    
    <!-- Szuflady -->
    <rect x="990.2" y="452.0" width="168.0" height="38.4" class="drawer"/>
    <text x="1073.0" y="478.4" class="item-sub" text-anchor="middle">Szuflada 1: akcesoria</text>
    <rect x="990.2" y="495.2" width="168.0" height="38.4" class="drawer"/>
    <text x="1073.0" y="521.5999999999999" class="item-sub" text-anchor="middle">Szuflada 2: pasty/buty</text>
    
    <!-- 3 półki na buty -->
    
        <line x1="991.0" y1="549.2" x2="1155.0" y2="592.0" stroke="#0284C7" stroke-width="2"/>
        <text x="1073.0" y="571.6" class="item-sub" font-size="8.5" text-anchor="middle">Półka skośna 7</text>
        
        <line x1="991.0" y1="602.0" x2="1155.0" y2="644.8" stroke="#0284C7" stroke-width="2"/>
        <text x="1073.0" y="624.4" class="item-sub" font-size="8.5" text-anchor="middle">Półka skośna 8</text>
        
        <line x1="991.0" y1="654.8000000000001" x2="1155.0" y2="697.6" stroke="#0284C7" stroke-width="2"/>
        <text x="1073.0" y="677.2" class="item-sub" font-size="8.5" text-anchor="middle">Półka skośna 9</text>
        
    <!-- 3. SZAFA NA WYMIAR (PO PRAWEJ PRZY WEJŚCIU) -->
    <rect x="1228.0" y="140" width="300.0" height="576.0" class="corp-frame" />
    <rect x="1228.0" y="112" width="300.0" height="24" fill="#7E22CE" rx="4"/>
    <text x="1378.0" y="128" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">3. SZAFA WEJŚCIOWA (szer. 125 cm, gł. 62 cm)</text>
    
    <!-- Blenda lewa 12cm, lewa 50cm, podział 2cm, prawa 51cm, blenda prawa 10cm -->
    <line x1="1256.8" y1="140" x2="1256.8" y2="716.0" stroke="#94A3B8" stroke-dasharray="2,2"/>
    <line x1="1381.6" y1="140" x2="1381.6" y2="716.0" stroke="#0F172A" stroke-width="2"/>
    <line x1="1504.0" y1="140" x2="1504.0" y2="716.0" stroke="#94A3B8" stroke-dasharray="2,2"/>
    
    <!-- Pawlacze -->
    <line x1="1228.0" y1="248.0" x2="1528.0" y2="248.0" class="shelf"/>
    <text x="1319.2" y="202.4" class="item-sub" text-anchor="middle">Pawlacz 50cm</text>
    <text x="1441.6" y="202.4" class="item-sub" text-anchor="middle">Nadstawka 51cm</text>
    
    <!-- Strefa wieszania długich płaszczy 160 cm -->
    <rect x="1261.6" y="255.2" width="115.19999999999999" height="374.4" class="hanging-area"/>
    <line x1="1271.2" y1="296.0" x2="1372.0" y2="296.0" class="rod"/>
    <text x="1319.2" y="392.0" class="item-text" font-size="10" fill="#7E22CE" text-anchor="middle">DRĄŻEK 160 cm</text>
    <text x="1319.2" y="428.0" class="item-text" font-size="9" text-anchor="middle">DŁUGIE PŁASZCZE</text>
    <text x="1319.2" y="464.0" class="item-sub" font-size="8.5" text-anchor="middle">i trencze zimowe</text>
    
    <!-- Dolna szuflada -->
    <line x1="1256.8" y1="632.0" x2="1381.6" y2="632.0" class="shelf"/>
    <rect x="1261.6" y="639.2" width="115.19999999999999" height="72.0" class="drawer"/>
    <text x="1319.2" y="677.6" class="item-sub" text-anchor="middle">Szuflada 35cm</text>
    
    <!-- Regał obuwniczy (prawa kolumna 51 cm) -->
    <line x1="1381.6" y1="306.5" x2="1504.0" y2="306.5" class="shelf"/><text x="1441.6" y="280.25" class="item-sub" font-size="8.5" text-anchor="middle">Czapki / szale</text><line x1="1381.6" y1="365.0" x2="1504.0" y2="365.0" class="shelf"/><text x="1441.6" y="338.75" class="item-sub" font-size="8.5" text-anchor="middle">Czapki / szale</text><line x1="1381.6" y1="423.5" x2="1504.0" y2="423.5" class="shelf"/><text x="1441.6" y="397.25" class="item-sub" font-size="8.5" text-anchor="middle">Czapki / szale</text><line x1="1381.6" y1="482.0" x2="1504.0" y2="482.0" class="shelf"/><text x="1441.6" y="455.75" class="item-sub" font-size="8.5" text-anchor="middle">Buty bieżące 1</text><line x1="1381.6" y1="540.5" x2="1504.0" y2="540.5" class="shelf"/><text x="1441.6" y="514.25" class="item-sub" font-size="8.5" text-anchor="middle">Buty bieżące 2</text><line x1="1381.6" y1="599.0" x2="1504.0" y2="599.0" class="shelf"/><text x="1441.6" y="572.75" class="item-sub" font-size="8.5" text-anchor="middle">Buty bieżące 3</text><line x1="1381.6" y1="657.5" x2="1504.0" y2="657.5" class="shelf"/><text x="1441.6" y="631.25" class="item-sub" font-size="8.5" text-anchor="middle">Buty bieżące 4</text><text x="1441.6" y="689.75" class="item-sub" font-size="8.5" text-anchor="middle">Buty bieżące 5</text>
    <g transform="translate(0, 751.0)">
        
    <g>
        <line x1="90" y1="0" x2="90" y2="-4" stroke="#DC2626" stroke-width="1" stroke-dasharray="2,2"/>
        <line x1="738.0" y1="0" x2="738.0" y2="-4" stroke="#DC2626" stroke-width="1" stroke-dasharray="2,2"/>

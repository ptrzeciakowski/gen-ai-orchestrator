    <text x="175" y="45" class="title">NOWY PAX 35 cm (2 × 75 cm) – WARIANT 1</text>
    <text x="175" y="70" class="subtitle">Ściana 150 cm | Głębokość korpusu 35 cm (z drzwiami ~44 cm) | Wys. 236 cm (drzwi przesuwne)</text>
    

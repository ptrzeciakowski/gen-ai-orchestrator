    <text x="175" y="45" class="title">SZAFA NA WYMIAR PRZY WEJŚCIU – WARIANT 1</text>
    <text x="175" y="70" class="subtitle">Wnęka 125 cm × głębokość 62 cm | Lewa: Długie płaszcze (160 cm luzu) | Prawa: Regał obuwniczy</text>
    
    <rect x="175" y="145" width="437.5" height="840.0" class="corp-frame" />
    

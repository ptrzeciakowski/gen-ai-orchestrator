<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 1080" width="1260" height="1080" style="background:#FFFFFF;">
    
    <style>
        text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .title { font-size: 23px; font-weight: 800; fill: #0F172A; letter-spacing: -0.5px; }
        .subtitle { font-size: 13px; font-weight: 500; fill: #475569; }
        .corp-frame { fill: #FFFFFF; stroke: #0F172A; stroke-width: 3.5; }
        .corp-inner { fill: #F8FAFC; stroke: #94A3B8; stroke-width: 1.5; }
        .shelf { fill: #FFFFFF; stroke: #334155; stroke-width: 2.5; }
        .dryer-bg { fill: #E0F2FE; stroke: #0284C7; stroke-width: 2; rx: 6px; }
        .laundry-niche { fill: #F0FDF4; stroke: #16A34A; stroke-width: 1.5; stroke-dasharray: 4,4; rx: 4px; }
        .drawer { fill: #F1F5F9; stroke: #475569; stroke-width: 2; rx: 4px; }
        .basket { fill: #F8FAFC; stroke: #64748B; stroke-width: 1.5; stroke-dasharray: 4,3; rx: 3px; }
        .shoe-shelf-bg { fill: #F1F5F9; stroke: #64748B; stroke-width: 1.5; rx: 4px; }
        .hanging-area { fill: #FAF5FF; stroke: #A855F7; stroke-width: 1.5; stroke-dasharray: 4,4; rx: 5px; }
        .guitar-area { fill: #FEF3C7; stroke: #D97706; stroke-width: 1.8; rx: 5px; }
        .dyson-area { fill: #FDF2F8; stroke: #DB2777; stroke-width: 1.8; rx: 5px; }
        .vacuum-area { fill: #F5F3FF; stroke: #7C3AED; stroke-width: 1.8; rx: 5px; }
        .ladder-area { fill: #F1F5F9; stroke: #475569; stroke-width: 1.8; rx: 4px; }
        .paper-towel-area { fill: #ECFDF5; stroke: #059669; stroke-width: 1.5; rx: 4px; }
        .backpack-area { fill: #EFF6FF; stroke: #2563EB; stroke-width: 1.5; rx: 4px; }
        .rod { stroke: #475569; stroke-width: 4; stroke-linecap: round; }
        .item-text { font-size: 11px; font-weight: 700; fill: #1E293B; }
        .item-sub { font-size: 9.5px; font-weight: 500; fill: #64748B; }
        .dim-text { font-size: 11px; font-weight: 700; fill: #DC2626; }
        .dim-title { font-size: 12.5px; font-weight: 800; fill: #DC2626; }
        .tag { font-size: 10px; font-weight: 700; fill: #FFFFFF; rx: 3px; }
        .badge-green { fill: #15803D; rx: 4px; }
        .badge-purple { fill: #7E22CE; rx: 4px; }
        .badge-amber { fill: #B45309; rx: 4px; }
        .badge-blue { fill: #1D4ED8; rx: 4px; }
    </style>
    <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
        </marker>
        <marker id="arr-rev" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
        </marker>
    </defs>

    
    <text x="175" y="42" class="title">ISTNIEJĄCY PAX 58 cm (270 cm) – WARIANT 2 (MAKSYMALNA GARDEROBA)</text>
    <text x="175" y="66" class="subtitle">Drążek nad suszarką ZOSTAJE | Wnęka 31 cm: Odkurzacz Amica pionowo | W module 100 cm ZOSTAJĄ 3 SZUFLADY! | W 50 cm: Gitara + Drabina</text>
    
    <rect x="175" y="85" width="710" height="28" fill="#F0FDF4" stroke="#16A34A" rx="4"/>
    <text x="530" y="103" fill="#15803D" font-size="11.5" font-weight="700" text-anchor="middle">ZACHOWANE 100% SZUFLAD NA UBRANIA W PAX 58! DYSON I MOP PRZENIESIONE DO NOWEGO PAX 35</text>
    
    <rect x="175" y="145" width="864.0" height="755.2" class="corp-frame" />
    <line x1="495.0" y1="145" x2="495.0" y2="900.2" stroke="#0F172A" stroke-width="3" />
    <line x1="815.0" y1="145" x2="815.0" y2="900.2" stroke="#0F172A" stroke-width="3" />
    <line x1="975.0" y1="145" x2="975.0" y2="900.2" stroke="#0F172A" stroke-width="3" />
    
    <!-- MODUŁ 1: 100 CM -->
    <rect x="179" y="149" width="312.0" height="107.2" fill="#F8FAFC" rx="4"/>
    <text x="335.0" y="202.6" class="item-text" text-anchor="middle">PAWLACZ: CZARNA WALIZKA PODRÓŻNA (36 cm)</text>
    <line x1="175" y1="260.2" x2="495.0" y2="260.2" class="shelf" />
    
    <rect x="181" y="266.2" width="308.0" height="292.0" class="hanging-area" />
    <line x1="191" y1="288.2" x2="479.0" y2="288.2" class="rod" />
    <text x="335.0" y="312.2" class="item-text" fill="#7E22CE" font-size="12" text-anchor="middle">DRĄŻEK 100 cm NAD SUSZARKĄ (ZOSTAJE!)</text>
    <text x="335.0" y="332.2" class="item-text" text-anchor="middle">Koszule dosychające po suszeniu / kurtki codzienne</text>
    <text x="335.0" y="348.2" class="item-sub" text-anchor="middle">Wysokość wiszenia: 95 cm – swobodny zwis nad płytą suszarki</text>
    <line x1="175" y1="564.2" x2="495.0" y2="564.2" class="shelf" />
    
    <!-- Dół modułu 1: Suszarka Beko + Wnęka 31 cm (Odkurzacz pionowo + miska) -->
    <rect x="183" y="574.2" width="192.0" height="272.0" class="dryer-bg" />
    <circle cx="279.0" cy="710.2" r="65" fill="#BAE6FD" stroke="#0284C7" stroke-width="2.5" />
    <circle cx="279.0" cy="710.2" r="50" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="4,2" />
    <rect x="191" y="582.2" width="176.0" height="28" fill="#0284C7" rx="3" />
    <circle cx="279.0" cy="596.2" r="8" fill="#FFFFFF" />
    <text x="279.0" y="715.2" class="item-text" fill="#0369A1" font-size="12" text-anchor="middle">SUSZARKA BEKO</text>
    <text x="279.0" y="730.2" class="item-sub" fill="#0284C7" text-anchor="middle">szer. 60 cm | wys. 85 cm</text>
    
    <rect x="383.0" y="574.2" width="99.2" height="272.0" class="vacuum-area" />
    <rect x="387.0" y="724.2" width="91.2" height="160.0" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" rx="4"/>
    <text x="432.6" y="797.8000000000001" class="item-text" fill="#6D28D9" font-size="11" text-anchor="middle">ODKURZACZ AMICA</text>
    <text x="432.6" y="842.6" class="item-sub" fill="#7C3AED" text-anchor="middle">postawiony pionowo</text>
    <text x="432.6" y="881.0" class="item-sub" fill="#7C3AED" text-anchor="middle">(szer. 28 cm pasuje idealnie!)</text>
    
    <text x="432.6" y="592.2" class="item-text" fill="#15803D" text-anchor="middle">MISKA PIONOWO</text>
    <text x="432.6" y="608.2" class="item-sub" fill="#166534" text-anchor="middle">+ proszki / kapsułki</text>
    
    <!-- MODUŁ 2: 100 CM (KOMPLET 3 SZUFLAD NA UBRANIA!) -->
    <rect x="499.0" y="149" width="312.0" height="107.2" fill="#F8FAFC" rx="4"/>
    <text x="655.0" y="202.6" class="item-text" text-anchor="middle">PAWLACZ: CZERWONA DUŻA WALIZKA (36 cm)</text>
    <line x1="495.0" y1="260.2" x2="815.0" y2="260.2" class="shelf" />
    
    <rect x="501.0" y="266.2" width="308.0" height="324.0" class="hanging-area" />
    <line x1="511.0" y1="288.2" x2="799.0" y2="288.2" class="rod" />
    <text x="655.0" y="312.2" class="item-text" fill="#7E22CE" font-size="12" text-anchor="middle">DRĄŻEK 100 cm: GŁÓWNA GARDEROBA (ZOSTAJE!)</text>
    <text x="655.0" y="332.2" class="item-text" text-anchor="middle">Garnitury w pokrowcach, koszule, marynarki</text>
    <text x="655.0" y="348.2" class="item-sub" text-anchor="middle">Wysokość wiszenia 105 cm (głębokość 58 cm)</text>
    <line x1="495.0" y1="596.2" x2="815.0" y2="596.2" class="shelf" />
    
    <!-- 3 SZUFLADY KOMPLEMENT 100 CM -->
    <rect x="501.0" y="599.2" width="308.0" height="51.6" class="drawer" />
    <text x="655.0" y="629.0" class="item-text" text-anchor="middle">SZUFLADA 1 (KOMPLEMENT 100 cm): Bielizna osobista i skarpetki</text>
    <line x1="495.0" y1="653.8" x2="815.0" y2="653.8" class="shelf" />
    
    <rect x="501.0" y="656.8" width="308.0" height="51.6" class="drawer" />
    <text x="655.0" y="686.5999999999999" class="item-text" text-anchor="middle">SZUFLADA 2 (KOMPLEMENT 100 cm): T-shirty, koszulki polo, odzież codzienna</text>
    <line x1="495.0" y1="711.4000000000001" x2="815.0" y2="711.4000000000001" class="shelf" />
    
    <rect x="501.0" y="714.4000000000001" width="308.0" height="51.6" class="drawer" />
    <text x="655.0" y="744.2" class="item-text" text-anchor="middle">SZUFLADA 3 (KOMPLEMENT 100 cm): Spodnie, swetry, bluzy, tekstylia</text>
    <line x1="495.0" y1="769.0" x2="815.0" y2="769.0" class="shelf" />
    
    <!-- Półka / dno pod szufladami -->
    <rect x="501.0" y="773.0" width="308.0" height="123.20000000000005" fill="#F8FAFC" rx="4" />
    <text x="655.0" y="794.0" class="item-text" fill="#475569" text-anchor="middle">PÓŁKA DOLNA / DNO SZAFY 100 cm</text>
    <text x="655.0" y="811.0" class="item-sub" text-anchor="middle">Płaskie pojemniki SKUBB: zapasowe kołdry, poduszki, pościel dla gości</text>
    
    <!-- MODUŁ 3: 50 CM (Gitara + Drabina bez Dysona – pełna swoboda!) -->
    <rect x="819.0" y="149" width="152.0" height="107.2" fill="#F8FAFC" rx="4"/>
    <text x="895.0" y="207.6" class="item-text" text-anchor="middle">PAWLACZ</text>
    <line x1="815.0" y1="260.2" x2="975.0" y2="260.2" class="shelf" />
    
    <rect x="821.0" y="266.2" width="148.0" height="420.0" class="corp-inner" />
    
    <!-- Gitara -->
    <rect x="823.0" y="268.2" width="89.60000000000001" height="416.0" class="guitar-area" />
    <text x="867.8" y="290.2" class="item-text" fill="#B45309" text-anchor="middle">GITARA</text>
    <text x="867.8" y="306.2" class="item-sub" fill="#92400E" text-anchor="middle">w pokrowcu</text>
    <text x="867.8" y="322.2" class="item-sub" fill="#92400E" text-anchor="middle">szeroka wnęka</text>
    <text x="867.8" y="338.2" class="item-sub" fill="#92400E" text-anchor="middle">brak ścisku!</text>
    
    <!-- Drabina -->
    <rect x="916.6" y="268.2" width="50.39999999999999" height="416.0" class="ladder-area" />
    <text x="941.8000000000001" y="476.2" class="item-text" text-anchor="middle" transform="rotate(-90 941.8000000000001 476.2)">DRABINA ALUMINIOWA</text>
    
    <line x1="815.0" y1="692.2" x2="975.0" y2="692.2" class="shelf" />
    
    <!-- Półki narzędziowe Parkside -->
    <rect x="821.0" y="696.2" width="148.0" height="64.0" fill="#F1F5F9" rx="3"/>
    <text x="895.0" y="708.2" class="item-text" text-anchor="middle">WALIZKA PARKSIDE 1</text>
    <line x1="815.0" y1="762.6" x2="975.0" y2="762.6" class="shelf" />
    
    <rect x="821.0" y="766.6" width="148.0" height="64.0" fill="#F1F5F9" rx="3"/>
    <text x="895.0" y="778.6" class="item-text" text-anchor="middle">SKRZYNKA PARKSIDE 2</text>
    <line x1="815.0" y1="833.0" x2="975.0" y2="833.0" class="shelf" />
    
    <rect x="821.0" y="837.0" width="148.0" height="64.0" class="basket"/>
    <text x="895.0" y="849.0" class="item-sub" font-weight="700" text-anchor="middle">Kosz druciany KOMPLEMENT</text>
    
    <!-- MODUŁ 4: 20 CM -->
    <rect x="979.0" y="149" width="56.0" height="107.2" fill="#F8FAFC" rx="4"/>
    <text x="1007.0" y="198.6" class="item-text" font-size="10" text-anchor="middle">ŻELAZ-</text>
    <text x="1007.0" y="212.6" class="item-text" font-size="10" text-anchor="middle">KO</text>
    <line x1="975.0" y1="260.2" x2="1039.0" y2="260.2" class="shelf" />
    
    <rect x="979.0" y="266.2" width="56.0" height="628.0" fill="#F8FAFC" stroke="#94A3B8" stroke-dasharray="2,2" rx="3"/>
    <text x="1007.0" y="522.6" class="item-text" font-size="10" text-anchor="middle" transform="rotate(-90 1007.0 522.6)">DESKA DO PRASOWANIA</text>
    
    
    <g>
        <line x1="175" y1="145" x2="175" y2="96" stroke="#DC2626" stroke-width="1" stroke-dasharray="2,2"/>
        <line x1="1039.0" y1="145" x2="1039.0" y2="96" stroke="#DC2626" stroke-width="1" stroke-dasharray="2,2"/>
        <line x1="179" y1="100" x2="1035.0" y2="100" stroke="#DC2626" stroke-width="1.5" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
        <text x="607.0" y="95" class="dim-text" text-anchor="middle">ŁĄCZNA SZEROKOŚĆ ZABUDOWY PAX 58: 270 cm</text>
    </g>
    </svg>
    <line x1="275.0" y1="627.4" x2="345.0" y2="627.4" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <text x="310.0" y="641.4" class="item-text" text-anchor="middle">SZUFLADA 2 (KOMPLEMENT): Rękawiczki, szale, kominy, apaszki</text>
    <line x1="175" y1="663.4" x2="445.0" y2="663.4" class="shelf" />
    
    <!-- Szuflada 3 -->

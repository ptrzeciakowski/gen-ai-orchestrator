    <text x="310.0" y="775.4" class="item-sub" text-anchor="middle">zapasowe akcesoria do sprzętów domowych</text>
    
    <rect x="451.0" y="151" width="258.0" height="119.6" fill="#F8FAFC" rx="4"/>
    <text x="580.0" y="209.8" class="item-text" text-anchor="middle">PAWLACZ: PÓŁKA 75×35 cm (36 cm)</text>
    <text x="580.0" y="224.8" class="item-sub" text-anchor="middle">pudła SKUBB na akcesoria zapasowe</text>
    <line x1="445.0" y1="274.6" x2="715.0" y2="274.6" class="shelf" />
    
    <rect x="453.0" y="280.6" width="254.0" height="294.0" class="hanging-area" />
    <line x1="580.0" y1="289.6" x2="580.0" y2="339.6" stroke="#475569" stroke-width="5" stroke-linecap="round"/>

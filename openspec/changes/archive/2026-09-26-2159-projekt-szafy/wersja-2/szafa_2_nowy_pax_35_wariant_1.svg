    <text x="310.0" y="451.6" class="item-text" fill="#1D4ED8" text-anchor="middle">PLECAKI I TORBY CODZIENNE</text>
    <text x="310.0" y="467.6" class="item-sub" fill="#1E40AF" text-anchor="middle">miejsce na 4-5 plecaków stojących swobodnie bez gniecenia</text>
    <line x1="175" y1="519.4" x2="445.0" y2="519.4" class="shelf" />
    
    <!-- Szuflada 1 -->

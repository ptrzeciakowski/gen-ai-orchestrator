    <line x1="275.0" y1="555.4" x2="345.0" y2="555.4" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <text x="310.0" y="569.4" class="item-text" text-anchor="middle">SZUFLADA 1 (KOMPLEMENT): Czapki zimowe, kapelusze, opaski</text>
    <line x1="175" y1="591.4" x2="445.0" y2="591.4" class="shelf" />
    
    <!-- Szuflada 2 -->

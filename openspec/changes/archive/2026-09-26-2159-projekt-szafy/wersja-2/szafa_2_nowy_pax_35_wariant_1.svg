    <text x="580.0" y="295.6" fill="#FFFFFF" font-size="8" font-weight="700" text-anchor="middle">WYSUW</text>
    
    <text x="580.0" y="369.6" class="item-text" fill="#7E22CE" font-size="12" text-anchor="middle">WYSUWANY WIESZAK KOMPLEMENT</text>
    <text x="580.0" y="389.6" class="item-text" text-anchor="middle">5–6 LEKKICH KURTEK CODZIENNYCH</text>
    <text x="580.0" y="406.6" class="item-sub" text-anchor="middle">wiatrówki, ramoneski, bluzy wiszące wzdłuż</text>
    <line x1="445.0" y1="580.6" x2="715.0" y2="580.6" class="shelf" />
    
    <rect x="451.0" y="584.6" width="258.0" height="64.0" class="drawer" />
    <line x1="545.0" y1="616.6" x2="615.0" y2="616.6" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <text x="580.0" y="630.6" class="item-text" text-anchor="middle">SZUFLADA 4: Ściereczki z mikrofibry, zapasy czyszczące</text>
    <line x1="445.0" y1="652.6" x2="715.0" y2="652.6" class="shelf" />
    
    <rect x="451.0" y="656.6" width="258.0" height="64.0" class="drawer" />
    <line x1="545.0" y1="688.6" x2="615.0" y2="688.6" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <text x="580.0" y="702.6" class="item-text" text-anchor="middle">SZUFLADA 5: Domowa apteczka, zapasy higieniczne, baterie</text>
    <line x1="445.0" y1="724.6" x2="715.0" y2="724.6" class="shelf" />
    
    <rect x="451.0" y="728.6" width="258.0" height="127.0" fill="#F8FAFC" rx="3"/>
    <text x="580.0" y="790.1" class="item-text" text-anchor="middle">PÓŁKA: PAPIER TOALETOWY (ZAPAS)</text>
    <text x="580.0" y="804.1" class="item-sub" text-anchor="middle">zgrzewka papieru / chusteczki higieniczne</text>
    <line x1="445.0" y1="859.6" x2="715.0" y2="859.6" class="shelf" />
    
    <rect x="451.0" y="863.6" width="258.0" height="127.0" fill="#F8FAFC" rx="3"/>
    <text x="580.0" y="925.1" class="item-text" text-anchor="middle">DNO: ZAPASY CHEMII GOSPODARCZEJ</text>
    <text x="580.0" y="939.1" class="item-sub" text-anchor="middle">płyny do szyb, mydła, wkłady, gąbki</text>
    

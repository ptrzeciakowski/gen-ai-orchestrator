    <text x="90" y="42" class="title">PANORAMA UKŁADU SZAF W CAŁYM MIESZKANIU – WERSJA 2 (WARIANT 2)</text>
    <text x="90" y="66" class="subtitle">Wspólna skala (1 cm = 2.4 px) | W PAX 58 zostają 3 szuflady na ubrania! | Dyson + wiadro mopa w PAX 35 | Szafa na wymiar = 100% butów</text>
    

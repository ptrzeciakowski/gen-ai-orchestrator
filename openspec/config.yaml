schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

rules:
  exploration:
    - Must enforce the 12 Rules from .ai/guidelines/brutally-honest-rules.md
    - Include explicit sections for Uncertainty, Missing Context, and Alternative Paths
  proposal:
    - Must enforce the 12 Rules from .ai/guidelines/brutally-honest-rules.md
    - Explicitly state Non-Goals, Risks, and unverified assumptions
  design:
    - Must enforce the 12 Rules from .ai/guidelines/brutally-honest-rules.md
    - Challenge initial design assumptions brutally and map out multiple options
    - Never disguise guesses as facts and never invent statistics or citations

